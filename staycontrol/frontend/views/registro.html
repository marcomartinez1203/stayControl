<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayControl - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/registro.css">
</head>
<body>
    <main class="login registro">
        <div class="top-area">
            <header class="brand-section">
                <div class="logo-box">
                    <svg class="key-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                        <circle cx="11.5" cy="20.5" r="7.2" stroke="white" stroke-width="2"/>
                        <path d="M16.5 15.5L25.5 6.5M22 10L25 13M24.5 7.5L27 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <p class="brand-name">StayControl</p>
                    <h1>Crear cuenta</h1>
                    <p>Registra tus datos para comenzar</p>
                </div>
            </header>

            <section class="form-section" aria-label="Datos de registro">
                <div class="field">
                    <label for="usuario">Nombre de usuario</label>
                    <div class="input-container">
                        <input type="text" id="usuario" autocomplete="nickname" placeholder="Tu nombre de usuario" maxlength="120">
                    </div>
                </div>
                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <div class="input-container">
                        <input type="email" id="email" autocomplete="email" placeholder="nombre@correo.com">
                    </div>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <input type="password" id="password" autocomplete="new-password" placeholder="Crea una contraseña" minlength="12" maxlength="128" aria-describedby="passwordHint">
                    </div>
                    <p class="field-hint" id="passwordHint">Entre 12 y 128 caracteres.</p>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-container">
                        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="12" maxlength="128">
                    </div>
                </div>
            </section>
        </div>

        <footer class="bottom-area">
            <p class="view-notice" id="registroNotice">Vista previa: el registro todavía no está habilitado. No se guardan los datos.</p>
            <button type="button" class="login-button" disabled aria-describedby="registroNotice">Crear cuenta</button>
            <div class="register-footer">
                <span>¿Ya tienes una cuenta?</span>
                <a href="/login">Inicia sesión</a>
            </div>
        </footer>
    </main>
</body>
</html>
