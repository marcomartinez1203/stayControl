<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayControl - Limpieza</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/limpieza.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <h1>Tareas de Limpieza</h1>

        <span class="today">
            Hoy
        </span>
    </header>

    <!-- CLEANING TASKS -->
    <main class="tasks">

        <!-- TASK 103 -->
        <article class="task-card" data-numero="103">

            <button class="checkbox" type="button"></button>

            <div class="task-info">

                <div class="task-top">

                    <div class="room-name">
                        <strong>Hab. 103</strong>
                        <span>(Suite)</span>
                    </div>

                    <span class="priority urgent">
                        URGENTE
                    </span>

                </div>

                <div class="task-bottom">

                    <div class="staff">
                        <img
                            src="https://www.figma.com/api/mcp/asset/2b5a8cc1-23bd-4d70-b81b-bc3cbdf6bf0b.svg"
                            alt=""
                        >
                        <span>Juana Pérez</span>
                    </div>

                    <span class="task-status pending">
                        Pendiente
                    </span>

                </div>

            </div>

        </article>


        <!-- TASK 201 -->
        <article class="task-card" data-numero="201">

            <button class="checkbox" type="button"></button>

            <div class="task-info">

                <div class="task-top">

                    <div class="room-name">
                        <strong>Hab. 201</strong>
                        <span>(Individual)</span>
                    </div>

                    <span class="priority normal">
                        NORMAL
                    </span>

                </div>

                <div class="task-bottom">

                    <div class="staff">
                        <img
                            src="https://www.figma.com/api/mcp/asset/2b5a8cc1-23bd-4d70-b81b-bc3cbdf6bf0b.svg"
                            alt=""
                        >
                        <span>María Gómez</span>
                    </div>

                    <span class="task-status process">
                        En Proceso
                    </span>

                </div>

            </div>

        </article>


        <!-- TASK 105 -->
        <article class="task-card" data-numero="105">

            <button class="checkbox checked" type="button">
                <img
                    src="https://www.figma.com/api/mcp/asset/ace8b249-ed4c-44fd-8f82-571518d9d0eb.svg"
                    alt=""
                >
            </button>

            <div class="task-info">

                <div class="task-top">

                    <div class="room-name">
                        <strong>Hab. 105</strong>
                        <span>(Doble)</span>
                    </div>

                    <span class="priority normal">
                        NORMAL
                    </span>

                </div>

                <div class="task-bottom">

                    <div class="staff">
                        <img
                            src="https://www.figma.com/api/mcp/asset/2b5a8cc1-23bd-4d70-b81b-bc3cbdf6bf0b.svg"
                            alt=""
                        >
                        <span>Juana Pérez</span>
                    </div>

                    <span class="task-status completed">
                        Completada
                    </span>

                </div>

            </div>

        </article>


        <!-- TASK 204 -->
        <article class="task-card" data-numero="204">

            <button class="checkbox" type="button"></button>

            <div class="task-info">

                <div class="task-top">

                    <div class="room-name">
                        <strong>Hab. 204</strong>
                        <span>(Doble)</span>
                    </div>

                    <span class="priority urgent">
                        URGENTE
                    </span>

                </div>

                <div class="task-bottom">

                    <div class="staff">
                        <img
                            src="https://www.figma.com/api/mcp/asset/2b5a8cc1-23bd-4d70-b81b-bc3cbdf6bf0b.svg"
                            alt=""
                        >
                        <span>María Gómez</span>
                    </div>

                    <span class="task-status pending">
                        Pendiente
                    </span>

                </div>

            </div>

        </article>

    </main>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <a class="nav-item">
            <img
                src="https://www.figma.com/api/mcp/asset/5607ecd6-bf11-44d4-af1e-f3be1e27cf29.svg"
                alt=""
            >
            <span>Inicio</span>
        </a>

        <a class="nav-item">
            <img
                src="https://www.figma.com/api/mcp/asset/04f5a8be-c890-492f-9028-102afb84bab1.svg"
                alt=""
            >
            <span>Habitaciones</span>
        </a>

        <a class="nav-item">
            <img
                src="https://www.figma.com/api/mcp/asset/b8fe265e-e3c5-4c05-adb4-082e49c5accb.svg"
                alt=""
            >
            <span>Reservas</span>
        </a>

        <a class="nav-item">
            <img
                src="https://www.figma.com/api/mcp/asset/705238c0-6846-40f2-8d1f-999935c4b465.svg"
                alt=""
            >
            <span>Finanzas</span>
        </a>

        <a class="nav-item active">
            <img
                src="https://www.figma.com/api/mcp/asset/7f0064ab-1c16-4fd2-b375-e1cd6fe75dc7.svg"
                alt=""
            >
            <span>Limpieza</span>
        </a>

    </nav>

</div>

<script type="module" src="../controllers/limpiezaController.js"></script>
</body>
</html>
