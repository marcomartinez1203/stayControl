spring.application.name=staycontrol
# Configuración local: funciona desde la carpeta del proyecto y desde VS Code.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Spring Boot 4 usa spring.mongodb para la conexión.
spring.mongodb.uri=${MONGODB_URI:}
spring.mongodb.database=${MONGODB_DATABASE:staycontrol}
app.mongodb.verify-on-startup=${MONGODB_VERIFY_ON_STARTUP:true}

# Frontend editable durante el desarrollo; recursos empaquetados como respaldo.
spring.web.resources.static-locations=file:./frontend/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
